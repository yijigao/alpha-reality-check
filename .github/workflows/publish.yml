name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      wheel_sha256:
        description: Expected SHA-256 for the v0.1.0 wheel
        required: true
        type: string
      sdist_sha256:
        description: Expected SHA-256 for the v0.1.0 source distribution
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Verify reviewed artifact hashes
        run: |
          echo "${{ inputs.wheel_sha256 }}  dist/alpha_reality_check-0.1.0-py3-none-any.whl" | sha256sum --check --strict
          echo "${{ inputs.sdist_sha256 }}  dist/alpha_reality_check-0.1.0.tar.gz" | sha256sum --check --strict
      - name: Preserve verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
          if-no-files-found: error
      - name: Publish verified distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
