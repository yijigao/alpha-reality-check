[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "alpha-reality-check"
version = "0.1.0"
description = "Evidence-first diagnostics for strategy decay, concentration risk, and backtest-to-live gaps."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "yijigao"}]
keywords = [
  "quantitative-finance",
  "strategy-validation",
  "alpha-decay",
  "risk-management",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pandas-stubs>=2.1",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "types-PyYAML>=6.0",
]

[project.scripts]
alpha-rc = "alpha_reality_check.cli:app"

[project.urls]
Homepage = "https://github.com/yijigao/alpha-reality-check"
Issues = "https://github.com/yijigao/alpha-reality-check/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/alpha_reality_check"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["alpha_reality_check"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["alpha_reality_check"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
